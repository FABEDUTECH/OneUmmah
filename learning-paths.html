  var SEED="CREATE TABLE Customers(CustomerID INTEGER PRIMARY KEY, CustomerName TEXT, ContactName TEXT, City TEXT, Country TEXT);"+
  "INSERT INTO Customers VALUES (1,'Zenith Traders','Amir Khan','Bengaluru','India'),(2,'Blue Orchid Cafe','Sara Ali','Dubai','UAE'),(3,'Crescent Books','Imran Sheikh','Hyderabad','India'),(4,'Delta Electronics','Hana Yusuf','Riyadh','Saudi Arabia'),(5,'Evergreen Foods','Rahul Mehta','Mumbai','India'),(6,'Falcon Logistics','Omar Hassan','Dubai','UAE'),(7,'Garden Fresh',NULL,'Chennai','India'),(8,'Harbor Textiles','Layla Noor','Doha','Qatar');"+

  /* ---------- chapters ---------- */
  var SQL_CH=[
   {id:"home",t:"SQL HOME"},
   {id:"intro",t:"SQL Intro",p:["SQL (Structured Query Language) is the standard language for working with relational databases. You use it to store, read, change and remove data.","A relational database keeps its data in tables made of rows and columns. SQL is how you talk to those tables, and the same ideas work in MySQL, PostgreSQL, SQL Server and SQLite."],ex:"SELECT * FROM Customers;",q:["What does SQL stand for?",["Structured Query Language","Simple Question List","Stored Query Logic"],0]},
   {id:"syntax",t:"SQL Syntax",p:["Every SQL command is a statement. A statement is made of keywords such as SELECT and FROM, plus table and column names, and it ends with a semicolon.","Keywords are not case sensitive, but writing them in capitals makes queries easier to read."],ex:"SELECT CustomerName, City FROM Customers;",q:["Which symbol usually ends an SQL statement?",[".",";",":"],1]},
   {id:"select",t:"SQL Select",p:["SELECT chooses the columns you want to see. List the column names separated by commas, or use * to get every column.","FROM tells SQL which table to read the data from."],ex:"SELECT CustomerName, Country FROM Customers;",q:["Which command reads data from a table?",["GET","SELECT","FETCH"],1]},
   {id:"distinct",t:"SQL Select Distinct",p:["A column often repeats the same value many times. SELECT DISTINCT returns each different value only once.","Use it to answer questions such as: which countries do my customers live in?"],ex:"SELECT DISTINCT Country FROM Customers;",q:["What does DISTINCT do?",["Sorts the rows","Removes duplicate values","Deletes rows"],1]},
   {id:"where",t:"SQL Where",p:["WHERE keeps only the rows that match a condition. Text values go inside single quotes, numbers do not.","You can compare with =, &lt;&gt;, &gt;, &lt;, &gt;= and &lt;=."],ex:"SELECT * FROM Customers WHERE Country = 'India';",q:["Which clause filters rows?",["WHERE","ORDER BY","GROUP BY"],0]},
   {id:"orderby",t:"SQL Order By",p:["ORDER BY sorts the result. The default order is ascending (ASC). Add DESC to sort from the highest value to the lowest.","You can sort by more than one column by separating them with commas."],ex:"SELECT * FROM Orders ORDER BY Amount DESC;",q:["How do you sort from highest to lowest?",["ORDER BY column ASC","ORDER BY column DESC","SORT column"],1]},
   {id:"andornot",t:"SQL And, Or, Not",p:["Combine conditions inside WHERE. AND needs both conditions to be true, OR needs at least one, and NOT reverses a condition.","Use brackets when you mix them, so the result is exactly what you expect."],ex:"SELECT * FROM Customers WHERE Country = 'India' AND City <> 'Mumbai';",q:["Which operator needs BOTH conditions to be true?",["OR","AND","NOT"],1]},
   {id:"insert",t:"SQL Insert Into",p:["INSERT INTO adds a new row to a table. Name the columns, then give the matching values in the same order.","Run the example, then run SELECT again to see your new row."],ex:"INSERT INTO Customers (CustomerID, CustomerName, ContactName, City, Country)\nVALUES (9, 'Iris Stationery', 'Noor Jahan', 'Kochi', 'India');\n\nSELECT * FROM Customers;",q:["Which command adds a new row?",["ADD ROW","INSERT INTO","APPEND"],1]},
   {id:"null",t:"SQL Null Values",p:["NULL means there is no value in a field. It is not zero and it is not an empty text.","You cannot test it with =. Use IS NULL or IS NOT NULL."],ex:"SELECT CustomerName FROM Customers WHERE ContactName IS NULL;",q:["How do you test for a missing value?",["= NULL","IS NULL","== NULL"],1]},
   {id:"update",t:"SQL Update",p:["UPDATE changes values in existing rows. SET says what to change and WHERE says which rows.","Be careful: without WHERE every row in the table is changed."],ex:"UPDATE Customers SET City = 'Pune' WHERE CustomerID = 5;\n\nSELECT * FROM Customers WHERE CustomerID = 5;",q:["What happens if you run UPDATE without WHERE?",["Nothing","Only the first row changes","Every row changes"],2]},
   {id:"delete",t:"SQL Delete",p:["DELETE removes rows from a table. Like UPDATE, it should almost always have a WHERE clause.","DELETE removes rows only. The table itself stays."],ex:"DELETE FROM Orders WHERE OrderID = 110;\n\nSELECT * FROM Orders;",q:["Which command removes rows from a table?",["REMOVE","DELETE","DROP ROW"],1]},
   {id:"limit",t:"SQL Limit (Top)",p:["LIMIT returns only the first few rows. It is handy with ORDER BY, for example to get the top 3 biggest orders.","SQLite and MySQL use LIMIT. SQL Server uses SELECT TOP instead."],ex:"SELECT * FROM Orders ORDER BY Amount DESC LIMIT 3;",q:["Which keyword limits the number of rows in SQLite and MySQL?",["LIMIT","TOP","FIRST"],0]},
   {id:"aggregate",t:"SQL Aggregate Functions",p:["Aggregate functions turn many rows into one value: COUNT() counts rows, SUM() adds, AVG() averages, MIN() finds the smallest and MAX() the largest.","AS gives the result column a readable name."],ex:"SELECT COUNT(*) AS Orders, SUM(Amount) AS Total, AVG(Amount) AS Average,\n       MIN(Amount) AS Smallest, MAX(Amount) AS Largest\nFROM Orders;",q:["Which function counts rows?",["COUNT()","SUM()","TOTAL()"],0]},
   {id:"like",t:"SQL Like",p:["LIKE searches for a pattern in text. The % sign stands for any number of characters, and _ stands for exactly one.","'B%' means starts with B, '%a' means ends with a, and '%an%' means contains an."],ex:"SELECT * FROM Customers WHERE City LIKE 'H%';",q:["What does % mean in a LIKE pattern?",["Exactly one character","Any number of characters","A number"],1]},
   {id:"joins",t:"SQL Joins",p:["A JOIN combines rows from two tables using a related column. Here Orders.CustomerID points to Customers.CustomerID.","JOIN (INNER JOIN) keeps only rows that match in both tables. LEFT JOIN keeps every row from the left table."],ex:"SELECT Customers.CustomerName, Orders.OrderID, Orders.Amount\nFROM Orders\nJOIN Customers ON Orders.CustomerID = Customers.CustomerID;",q:["What does JOIN do?",["Combines rows from two tables","Deletes a table","Sorts a table"],0]},
   {id:"groupby",t:"SQL Group By",p:["GROUP BY puts rows with the same value into groups, so an aggregate function can work on each group.","Example: count how many customers live in each country."],ex:"SELECT Country, COUNT(*) AS Customers\nFROM Customers\nGROUP BY Country;",q:["GROUP BY is most often used with...",["Aggregate functions","INSERT","DROP"],0]}
  ];

   },
   {

    ]

   {
    "id": "py-sets",

    "p": [

    "q": [

      "By its key",
      "Only by its position",
      "With get_all()"

     0
    ]
   },
   {
    "id": "py-ifelse",
    "t": "Python If...Else",
    "p": [

    ],
    "ex": "marks = 75\nif marks >= 90:\n    print(\"Excellent\")\nelif marks >= 60:\n    print(\"Good\")\nelse:\n    print(\"Keep practising\")",
    "q": [

     [

   {

   },
   {

    "q": [
     "What does range(3) produce?",
     [
      "1, 2, 3",

     1

   },
   {

    "t": "Python Functions",
    "p": [
     "A function is a reusable block of code. Define it with def, give it parameters, and use return to send back a result.",
     "Call the function by writing its name with brackets. You can call it as many times as you like."
    ],
    "ex": "def greet(name):\n    return \"Hello, \" + name\n\nprint(greet(\"Sara\"))\nprint(greet(\"Amir\"))",
    "q": [
     "Which keyword defines a function?",
     [

  PATHS.sql={key:"sql",name:"SQL",course:"sql",pk:"sqlpath",CH:SQL_CH,strip:/^SQL /,kind:"sql",lab:"compiler.html",labName:"SQL Lab",title:"SQL Tutorial",enrollName:"Master SQL",home:"home"};
  PATHS.python={key:"python",name:"Python",course:"python",pk:"pypath",CH:PY_CH,strip:/^Python /,kind:"py",lab:"python-compiler.html",labName:"Python Lab",title:"Python Tutorial",enrollName:"Python for Data Engineering",home:"py-home"};
  function pick(k){P=PATHS[k];CH=P.CH;PATH=P.pk;paid=OUM.hasPaid(P.course)}

  /* ---------- helpers ---------- */
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  var KW="SELECT|FROM|WHERE|ORDER BY|GROUP BY|DISTINCT|AND|OR|NOT|INSERT INTO|VALUES|UPDATE|SET|DELETE|LIMIT|AS|JOIN|ON|LIKE|IS|NULL|DESC|ASC|COUNT|SUM|AVG|MIN|MAX";
  var KWRE=new RegExp("('[^']*')|\\b("+KW+")\\b","gi");
  var PYRE=/("[^"\n]*"|'[^'\n]*')|(#[^\n]*)|\b(print|if|elif|else|for|while|in|def|return|import|from|and|or|not|True|False|None|len|range|type|int|float|str|bool|append|class|is|break|continue|pass)\b/g;
  function hl(s){
    if(P.kind==="py")return esc(s).replace(PYRE,function(m,a,b,c){return a?'<span class="str">'+a+'</span>':(b?'<span class="cm">'+b+'</span>':'<span class="kw">'+c+'</span>')});
    return esc(s).replace(KWRE,function(m,a,b){return a?'<span class="str">'+a+'</span>':'<span class="kw">'+b+'</span>'});
  }
  function done(){return OUM.done(PATH)}
  function parse(){
    var h=location.hash.slice(1),sec="lesson";
    if(/-challenge$/.test(h)){sec="challenge";h=h.replace(/-challenge$/,"")}
    for(var k in PATHS){var L=PATHS[k].CH;for(var i=0;i<L.length;i++)if(L[i].id===h)return{k:k,i:i,sec:sec}}
    return{k:"sql",i:0,sec:"lesson"};
  }

  /* ---------- sidebar (with dropdowns) + mobile select ---------- */
  var open={},lastCur=-1;
  function renderSide(cur,sec){
    var box=byId("chList");box.innerHTML="";
    if(cur!==lastCur){open[cur]=true;lastCur=cur}
    var sel=byId("chSelect");
    if(!sel){sel=document.createElement("select");sel.id="chSelect";sel.className="lt-select";sel.setAttribute("aria-label","Choose a chapter");sel.onchange=function(){location.hash=this.value};byId("ltMain").parentNode.insertBefore(sel,byId("ltMain"))}
    sel.innerHTML="";
    CH.forEach(function(c,i){
      var hasSub=paid&&i>2,isCur=i===cur;
      var a=document.createElement("a");a.href="#"+c.id;
      a.className="ch"+(isCur?(hasSub?" cur":" on"):"");
      var s1=document.createElement("span");s1.textContent=c.t;
      var right=document.createElement("span");right.style.cssText="display:flex;align-items:center;gap:8px";
      var d=document.createElement("span");d.className="d";
      d.textContent=!paid?"🔒":(done().indexOf(i)>-1?"✓":"");
      right.appendChild(d);
      if(hasSub){
        var cw=document.createElement("span");cw.style.padding="6px";
        var car=document.createElement("i");car.className="car"+(open[i]?" up":"");
        cw.appendChild(car);
        cw.onclick=function(e){e.preventDefault();e.stopPropagation();open[i]=!open[i];renderSide(cur,sec)};
        right.appendChild(cw);
      }
      a.appendChild(s1);a.appendChild(right);box.appendChild(a);
      if(hasSub&&open[i]){
        var sub=document.createElement("div");sub.className="sub";
        var l1=document.createElement("a");l1.className="sb"+(isCur&&sec!=="challenge"?" on":"");l1.href="#"+c.id;l1.textContent=c.t.replace(P.strip,"");
        var l2=document.createElement("a");l2.className="sb"+(isCur&&sec==="challenge"?" on":"");l2.href="#"+c.id+"-challenge";l2.textContent="Code Challenge";
        sub.appendChild(l1);sub.appendChild(l2);box.appendChild(sub);
      }
      var o=document.createElement("option");o.value=c.id;o.textContent=c.t;if(isCur)o.selected=true;sel.appendChild(o);
    });
  }

  /* ---------- locked page (not enrolled) ---------- */
  function renderLocked(){
    var u=OUM.user(),n=CH.length-1;
    byId("ltRight").innerHTML="";
    var list=P.kind==="py"
      ?'<li>'+n+' step-by-step Python chapters</li><li>Try it Yourself editor that runs Python in your browser</li><li>Code Challenge after every chapter</li><li>Coding lab, assignment and certificate</li>'
      :'<li>'+n+' step-by-step SQL chapters</li><li>Try it Yourself editor with sample data</li><li>Code Challenge after every chapter</li><li>Coding lab, assignment and certificate</li>';
    byId("ltMain").innerHTML=
      '<div class="lt-lock"><div class="eyebrow"><span>‹</span><span>OneUmmah Data Skills</span><span>|</span><span>Learning Path</span><span>›</span></div>'+
      '<h2>Take your skills to the next level</h2>'+
      '<p>The '+P.name+' learning path is available to enrolled students. Enroll in '+P.enrollName+' to unlock every chapter.</p>'+
      '<ul>'+list+'</ul>'+
      '<div class="row"><button class="btn" type="button" onclick="startEnroll(\''+P.course+'\')">Enroll in '+P.enrollName+'</button>'+
      (u?'':'<a class="btn outline" href="login.html">Login</a>')+'</div></div>';
  }

  /* ---------- try it yourself (sql.js, loaded only when needed) ---------- */
  var S=null,db=null,loading=null;
  var LIB="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/";
  function ensureDb(){
    if(db)return Promise.resolve(db);
    if(loading)return loading;
    loading=new Promise(function(res,rej){
      var s=document.createElement("script");s.src=LIB+"sql-wasm.js";
      s.onload=function(){initSqlJs({locateFile:function(f){return LIB+f}}).then(function(x){S=x;db=new S.Database();db.run(SEED);res(db)}).catch(rej)};
      s.onerror=function(){loading=null;rej(new Error("Could not load the SQL engine. Check your internet connection."))};
      document.head.appendChild(s);
    });
    return loading;
  }
  function table(r){
    var t=document.createElement("table"),h=document.createElement("tr");
    r.columns.forEach(function(c){var th=document.createElement("th");th.textContent=c;h.appendChild(th)});
    t.appendChild(h);
    r.values.forEach(function(row){var tr=document.createElement("tr");row.forEach(function(v){var td=document.createElement("td");td.textContent=v===null?"NULL":String(v);tr.appendChild(td)});t.appendChild(tr)});
    return t;
  }
  /* Python runs inside the browser with Pyodide (loaded only when needed) */
  var PYO=null,pyLoading=null;
  function ensurePy(){
    if(PYO)return Promise.resolve(PYO);
    if(pyLoading)return pyLoading;
    pyLoading=new Promise(function(res,rej){
      var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js";
      s.onload=function(){loadPyodide().then(function(x){PYO=x;res(x)}).catch(rej)};
      s.onerror=function(){pyLoading=null;rej(new Error("Could not load the Python engine. Check your internet connection."))};
      document.head.appendChild(s);
    });
    return pyLoading;
  }
  function runPy(){
    var out=byId("tryOut"),code=byId("tryEd").value;
    if(!code.trim()){out.textContent="Type some Python code first.";return}
    out.textContent="Running... (the first run loads Python and takes a few seconds)";
    ensurePy().then(function(py){
      py.runPython("import sys, io\nsys.stdout = io.StringIO()\nsys.stderr = io.StringIO()");
      return py.runPythonAsync(code,{globals:py.globals.get("dict")()}).then(function(){return null},function(e){return e}).then(function(err){
        var txt=py.runPython("sys.stdout.getvalue()")+py.runPython("sys.stderr.getvalue()");
        if(err)txt+=(txt&&!/\n$/.test(txt)?"\n":"")+String(err.message||err);
        out.innerHTML="";
        var pre=document.createElement("pre");pre.className=err?"bad":"";
        pre.textContent=txt||"✓ Done. (No output. Use print() to show a result.)";
        out.appendChild(pre);
      });
    }).catch(function(e){out.innerHTML="";var p=document.createElement("p");p.className="bad";p.style.margin="0";p.textContent=e.message;out.appendChild(p)});
  }
  function runSql(){
    var out=byId("tryOut"),sql=byId("tryEd").value.trim();
    if(!sql){out.textContent="Type a query first.";return}
    out.textContent="Running...";
    ensureDb().then(function(d){
      var res=d.exec(sql);out.innerHTML="";
      if(res.length){res.forEach(function(r){out.appendChild(table(r))})}
      else{var ch=d.getRowsModified(),p=document.createElement("p");p.className="ok";p.style.margin="0";p.textContent="✓ Done"+(ch?" · "+ch+" row(s) affected":"");out.appendChild(p)}
    }).catch(function(e){out.innerHTML="";var p=document.createElement("p");p.className="bad";p.style.margin="0";p.textContent="SQL Error: "+e.message;out.appendChild(p)});
  }
  function runTry(){P.kind==="py"?runPy():runSql()}
  function resetData(){
    if(!S||!db){byId("tryOut").textContent="Sample data is already fresh.";return}
    db.close();db=new S.Database();db.run(SEED);byId("tryOut").textContent="Sample data reset.";
  }

  /* ---------- chapter page ---------- */
  function exercise(i){
    var q=CH[i].q,h='<div class="lt-exercise" id="challenge"><h3>Code Challenge</h3><div class="q">'+esc(q[0])+'</div>';
    q[1].forEach(function(o,k){h+='<label><input type="radio" name="ex" value="'+k+'">'+esc(o)+'</label>'});
    return h+'<div class="fb" id="exFb"></div><button class="btn" id="exBtn" type="button">Submit Answer »</button></div>';
  }
  function show(i,sec){
    sec=sec||"lesson";
    if(!paid){renderLocked();renderSide(i,sec);return}
    var c=CH[i],m=byId("ltMain"),h="",isPy=P.kind==="py";
    var prev=i>0?CH[i-1]:null,next=i<CH.length-1?CH[i+1]:null;
    h+='<h1>'+(i===0?P.title:esc(c.t))+'</h1>';
    h+='<div class="lt-nav"><a class="btn outline sm" href="#'+(prev?prev.id:P.home)+'">‹ '+(i===0?"Home":"Previous")+'</a>'+(next?'<a class="btn sm" id="nextTop" href="#'+next.id+'">Next ›</a>':'<a class="btn sm" href="dashboard.html">Dashboard ›</a>')+'</div><hr class="lt-hr">';
    if(i===0){
      if(isPy){
        h+='<div class="lt-cards"><div><h2>Learn Python</h2><p>Python is a popular programming language. It is used for automation, data analysis, data engineering and AI.</p><p>This path teaches you Python step by step with short chapters, examples you can run in your browser, and a challenge after each one.</p><a class="btn" href="#py-intro">Learn Python now »</a></div>'+
           '<div><h2>Practise as you learn</h2><p>Every example has a <b>Try it Yourself</b> button. Edit the code and run it instantly. Python runs right inside your browser.</p><a class="btn outline" href="python-compiler.html">Open Python Lab →</a></div></div>';
        h+='<h2 style="margin:10px 0 12px">Try it Yourself</h2><p>With our online Python editor you can edit the code and click a button to view the result.</p>';
      }else{
        h+='<div class="lt-cards"><div><h2>Learn SQL</h2><p>SQL is a standard language for storing, changing and reading data in databases.</p><p>This path teaches you SQL step by step with short chapters, examples you can run, and an exercise after each one.</p><a class="btn" href="#intro">Learn SQL now »</a></div>'+
           '<div><h2>Practise as you learn</h2><p>Every example has a <b>Try it Yourself</b> button. Edit the query and see the result instantly, using a small sample database.</p><a class="btn outline" href="compiler.html">Open SQL Lab →</a></div></div>';
        h+='<h2 style="margin:10px 0 12px">Try it Yourself</h2><p>With our online SQL editor you can edit the statements and click a button to view the result.</p>';
      }
    }else{
      c.p.forEach(function(p){h+='<p>'+p+'</p>'});
    }
    h+='<div class="lt-ex-box"><h3>Example</h3><div class="code">'+hl(c.ex)+'</div><button class="btn sm" id="tryBtn" type="button">Try it Yourself »</button>'+
       '<div class="lt-try" id="tryBox"><textarea id="tryEd" spellcheck="false" aria-label="'+P.name+' editor"></textarea><div class="acts"><button class="btn sm" id="tryRun" type="button">▶ Run '+P.name+'</button><button class="btn outline sm" id="tryReset" type="button">'+(isPy?"Clear output":"Reset sample data")+'</button></div><div class="lt-out" id="tryOut">Click Run '+P.name+' to see the result.</div></div></div>';
    if(i===0)h+='<p>Click on the "Try it Yourself" button to see how it works.</p><h2 style="margin:26px 0 10px">'+P.name+' Exercises</h2><p>Each chapter ends with a code challenge where you can check your level of knowledge.</p>';
    h+=exercise(i);
    h+='<div class="lt-nav">'+(prev?'<a class="btn outline sm" href="#'+prev.id+'">‹ Previous</a>':'<span></span>')+(next?'<a class="btn sm" id="nextBot" href="#'+next.id+'">Next ›</a>':'<a class="btn sm" href="dashboard.html">Back to Dashboard</a>')+'</div>';
    m.innerHTML=h;

    byId("tryEd").value=c.ex;
    byId("tryBtn").onclick=function(){byId("tryBox").classList.toggle("open")};
    byId("tryRun").onclick=runTry;
    byId("tryReset").onclick=isPy?function(){byId("tryOut").textContent="Click Run Python to see the result."}:resetData;
    byId("tryEd").addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runTry()}});
    byId("exBtn").onclick=function(){
      var s=document.querySelector('input[name="ex"]:checked'),fb=byId("exFb");
      if(!s){fb.style.color="#ffd27a";fb.textContent="Choose an answer first.";return}
      if(+s.value===c.q[2]){fb.style.color="#7ee2a8";fb.textContent="✓ Correct!";OUM.markDone(PATH,i);renderSide(i,"challenge");renderRight(i)}
      else{fb.style.color="#ff9aa6";fb.textContent="Not quite. Read the chapter again and try once more."}
    };
    ["nextTop","nextBot"].forEach(function(id){var n=byId(id);if(n)n.onclick=function(){OUM.markDone(PATH,i)}});
    renderSide(i,sec);renderRight(i);
    if(sec==="challenge"){var cb=byId("challenge");if(cb)cb.scrollIntoView()}else{window.scrollTo(0,0)}
    document.title=(i===0?P.title:c.t)+" | OneUmmah Data Skills";
  }
  function renderRight(i){
    var n=done().length,pc=Math.round(n/CH.length*100);
    byId("ltRight").innerHTML=
      '<div class="lt-pcard"><h3>Your progress</h3><div class="lt-bar"><div style="width:'+pc+'%"></div></div><p style="margin:0;font-size:14px;color:var(--muted)">'+n+' of '+CH.length+' chapters done ('+pc+'%)</p></div>'+
      '<div class="lt-pcard"><h3>Practice more</h3><p style="font-size:14px;color:var(--muted);margin:0 0 6px">Write your own '+(P.kind==="py"?"programs":"queries")+' in the full '+P.labName+'.</p><a class="btn sm" href="'+P.lab+'">Open '+P.labName+'</a><a class="btn outline sm" href="dashboard.html">Go to Dashboard</a></div>';
  }

  document.querySelectorAll("[data-soon]").forEach(function(a){a.onclick=function(){say(a.getAttribute("data-soon")+" learning path is coming soon.")}});
  var curKey=null;
  function go(){
    var p=parse();
    if(curKey!==p.k){
      curKey=p.k;open={};lastCur=-1;pick(p.k);
      byId("sideHead").textContent=P.name.toUpperCase()+" TUTORIAL";
      byId("chList").setAttribute("aria-label",P.name+" chapters");
      byId("tabSql").className=p.k==="sql"?"on":"";
      byId("tabPy").className=p.k==="python"?"on":"";
    }
    show(p.i,p.sec);
  }
  window.addEventListener("hashchange",go);
  go();
})();
</script>
