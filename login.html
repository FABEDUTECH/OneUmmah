<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DataForge Academy</title>
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html"><span class="brand-mark">D</span> DataForge Academy</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="dashboard.html">Learning Dashboard</a>
      <a href="payments.html">Payments</a>
    </nav>
    <div class="nav-actions" id="guestActions">
      <a class="btn btn-ghost" href="login.html">Login</a>
      <a class="btn btn-primary" href="register.html">Register</a>
    </div>
    <div class="nav-actions user-chip" id="authActions" style="display:none">
      <a href="dashboard.html" class="user-pill"><span class="user-pill-avatar" id="navAvatar">K</span><span id="navName">Student</span></a>
      <button class="btn btn-ghost" onclick="handleLogout()">Logout</button>
    </div>
  </header>

  <main>
    <section class="auth-section">
      <div class="auth-card">
        <span class="eyebrow">WELCOME BACK</span><h2>Login</h2><p>Continue your learning journey.</p>
        <div class="form-error" id="loginError"></div>
        <input type="email" id="loginEmail" placeholder="Email address">
        <input type="password" id="loginPassword" placeholder="Password">
        <button class="btn btn-primary btn-wide" onclick="handleLogin()">Login</button>
        <small>Don't have an account? <a href="register.html">Register</a></small>
      </div>
    </section>

  </main>

  <footer>
    <div class="brand"><span class="brand-mark">D</span> DataForge Academy</div>
    <span>© 2026 Technical Learning Platform</span>
    <div><a href="courses.html">Courses</a> <a href="dashboard.html">Dashboard</a> <a href="login.html">Login</a></div>
  </footer>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>

</body>
</html>
